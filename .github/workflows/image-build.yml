name: Build and Publish Docker Image

on:
  push:
    branches:
      - master
      - main
  schedule:
    # 19:17 UTC = 03:17 GMT+8. Scheduled runs may be delayed by GitHub.
    - cron: '17 19 * * *'
  workflow_dispatch:
    inputs:
      platforms:
        description: Docker platforms to publish
        required: false
        type: choice
        default: linux/amd64,linux/arm64
        options:
          - linux/amd64,linux/arm64
          - linux/amd64
          - linux/arm64

permissions:
  contents: read

concurrency:
  group: image-publish-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: zerotier-planet
  DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME || secrets.DOCKERHUB_USERNAME }}
  ZEROTIER_REF: actions
  DOCKER_PLATFORMS: ${{ inputs.platforms || 'linux/amd64,linux/arm64' }}
  SMOKE_IMAGE: zerotier-planet:ci-smoke

jobs:
  frontend-quality:
    name: Frontend quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      should-build: ${{ steps.changes.outputs.should-build }}
      reason: ${{ steps.changes.outputs.reason }}
      zerotier-commit: ${{ steps.changes.outputs.zerotier-commit }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Decide whether a rebuild is required
        id: changes
        shell: bash
        run: |
          set -euo pipefail

          zerotier_commit="$(git ls-remote https://github.com/zerotier/ZeroTierOne.git "refs/heads/${ZEROTIER_REF}" | cut -f1)"
          if [ -z "${zerotier_commit}" ]; then
            echo "Unable to resolve ZeroTier ref: ${ZEROTIER_REF}"
            exit 1
          fi

          should_build=true
          reason="${GITHUB_EVENT_NAME} event always validates and publishes"
          image="${DOCKERHUB_USERNAME}/${IMAGE_NAME}:latest"

          if [ "${GITHUB_EVENT_NAME}" = "schedule" ]; then
            if [ -z "${DOCKERHUB_USERNAME}" ]; then
              echo "DOCKERHUB_USERNAME is required to compare the published image."
              exit 1
            fi

            repository="${DOCKERHUB_USERNAME,,}/${IMAGE_NAME}"
            registry_token="$(curl -fsS --retry 3 --connect-timeout 10 \
              "https://auth.docker.io/token?service=registry.docker.io&scope=repository:${repository}:pull" \
              | node -e '
                let raw = "";
                process.stdin.on("data", chunk => raw += chunk);
                process.stdin.on("end", () => {
                  const payload = JSON.parse(raw);
                  if (!payload.token) throw new Error("Docker registry auth did not return a token");
                  process.stdout.write(payload.token);
                });
              ')"

            # Resolve the amd64 child manifest, then read its image config labels.
            if published_index="$(curl -fsS --retry 3 --connect-timeout 10 \
              -H "Authorization: Bearer ${registry_token}" \
              -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json' \
              "https://registry-1.docker.io/v2/${repository}/manifests/latest")"; then
              platform_digest="$(node -e '
                const manifest = JSON.parse(process.argv[1]);
                const child = manifest.manifests?.find(item => item.platform?.os === "linux" && item.platform?.architecture === "amd64");
                process.stdout.write(child?.digest || "latest");
              ' "${published_index}")"
              published_manifest="$(curl -fsS --retry 3 --connect-timeout 10 \
                -H "Authorization: Bearer ${registry_token}" \
                -H 'Accept: application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json' \
                "https://registry-1.docker.io/v2/${repository}/manifests/${platform_digest}")"
              config_digest="$(node -e '
                const manifest = JSON.parse(process.argv[1]);
                if (!manifest.config?.digest) throw new Error("Published manifest has no image config");
                process.stdout.write(manifest.config.digest);
              ' "${published_manifest}")"
              image_config="$(curl -fsSL --retry 3 --connect-timeout 10 \
                -H "Authorization: Bearer ${registry_token}" \
                "https://registry-1.docker.io/v2/${repository}/blobs/${config_digest}")"
              published_source="$(node -e '
                const config = JSON.parse(process.argv[1]);
                process.stdout.write(config.config?.Labels?.["org.opencontainers.image.revision"] || "");
              ' "${image_config}")"
              published_zerotier="$(node -e '
                const config = JSON.parse(process.argv[1]);
                process.stdout.write(config.config?.Labels?.["io.zerotier-planet.zerotier-commit"] || "");
              ' "${image_config}")"

              if [ "${published_source}" = "${GITHUB_SHA}" ] && [ "${published_zerotier}" = "${zerotier_commit}" ]; then
                should_build=false
                reason="source and ZeroTier commits already match ${image}"
              else
                reason="published source=${published_source:-missing}, current source=${GITHUB_SHA}; published ZeroTier=${published_zerotier:-missing}, current ZeroTier=${zerotier_commit}"
              fi
            else
              reason="${image} is not available yet; an initial build is required"
            fi
          fi

          echo "should-build=${should_build}" >> "$GITHUB_OUTPUT"
          echo "reason=${reason}" >> "$GITHUB_OUTPUT"
          echo "zerotier-commit=${zerotier_commit}" >> "$GITHUB_OUTPUT"
          echo "Decision: should-build=${should_build}; ${reason}"

      - name: Record skipped schedule
        if: steps.changes.outputs.should-build != 'true'
        shell: bash
        env:
          REBUILD_REASON: ${{ steps.changes.outputs.reason }}
          ZEROTIER_COMMIT: ${{ steps.changes.outputs.zerotier-commit }}
        run: |
          {
            echo "## Docker rebuild skipped"
            echo
            echo "The scheduled check found no source changes."
            echo
            echo "- Repository commit: \`${GITHUB_SHA}\`"
            echo "- ZeroTier commit: \`${ZEROTIER_COMMIT}\`"
            echo "- Reason: ${REBUILD_REASON}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Node.js
        if: steps.changes.outputs.should-build == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        if: steps.changes.outputs.should-build == 'true'
        run: npm ci --ignore-scripts

      - name: Lint
        if: steps.changes.outputs.should-build == 'true'
        run: npm run lint

      - name: Type check
        if: steps.changes.outputs.should-build == 'true'
        run: npm run typecheck

      - name: Unit tests
        if: steps.changes.outputs.should-build == 'true'
        run: npm test

      - name: Build frontend
        if: steps.changes.outputs.should-build == 'true'
        run: npm run build

  image-smoke:
    name: Build and smoke test image
    needs: frontend-quality
    if: needs.frontend-quality.outputs.should-build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build local amd64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ env.SMOKE_IMAGE }}
          build-args: |
            TAG=${{ needs.frontend-quality.outputs.zerotier-commit }}
            SOURCE_COMMIT=${{ github.sha }}
            ZEROTIER_REF=${{ env.ZEROTIER_REF }}
            ZEROTIER_COMMIT=${{ needs.frontend-quality.outputs.zerotier-commit }}
          cache-from: |
            type=gha,scope=zerotier-planet-amd64
            type=gha,scope=zerotier-planet-publish
          cache-to: type=gha,mode=max,scope=zerotier-planet-amd64

      - name: Start image and verify console
        id: smoke
        shell: bash
        run: |
          set -euo pipefail

          container_name="ztp-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          volume_name="ztp-ci-data-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "container_name=${container_name}" >> "$GITHUB_OUTPUT"
          echo "volume_name=${volume_name}" >> "$GITHUB_OUTPUT"

          docker volume create "${volume_name}" >/dev/null
          docker run -d \
            --name "${container_name}" \
            -p 127.0.0.1::3000 \
            -e IP_ADDR4=127.0.0.1 \
            -e IP_ADDR6= \
            -e ZT_PORT=9994 \
            -e FILE_SERVER_PORT=3000 \
            -v "${volume_name}:/var/lib/zerotier-one" \
            "${SMOKE_IMAGE}" >/dev/null

          host_port="$(docker port "${container_name}" 3000/tcp | sed -n 's/.*://p' | tail -n 1)"
          test -n "${host_port}"
          base_url="http://127.0.0.1:${host_port}"

          for attempt in $(seq 1 90); do
            if ! docker inspect --format '{{.State.Running}}' "${container_name}" | grep -q '^true$'; then
              echo "Container exited before the console became ready."
              docker logs "${container_name}" || true
              exit 1
            fi
            if curl -fsS --max-time 3 "${base_url}/api/status" > /tmp/ztp-status.json; then
              break
            fi
            if [ "${attempt}" -eq 90 ]; then
              echo "Console did not become ready within 90 seconds."
              exit 1
            fi
            sleep 1
          done

          node -e '
            const fs = require("fs");
            const status = JSON.parse(fs.readFileSync("/tmp/ztp-status.json", "utf8"));
            if (status.service !== "zerotier-planet" || status.integratedController !== true) {
              throw new Error(`Unexpected status response: ${JSON.stringify(status)}`);
            }
          '

          curl -fsS --max-time 5 "${base_url}/" | grep -q '<div id="root"></div>'
          curl -fsS --max-time 5 "${base_url}/networks" | grep -q '<div id="root"></div>'
          curl -fsS --max-time 5 "${base_url}/assets/logo.svg" | grep -q '<svg'
          docker exec "${container_name}" test -s /app/dist/planet
          docker exec "${container_name}" test -s /app/portal/dist/index.html
          test "$(docker inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "${container_name}")" = "${GITHUB_SHA}"
          test "$(docker inspect --format '{{index .Config.Labels "io.zerotier-planet.zerotier-commit"}}' "${container_name}")" = "${{ needs.frontend-quality.outputs.zerotier-commit }}"

      - name: Show smoke test logs
        if: always() && steps.smoke.outputs.container_name != ''
        shell: bash
        run: docker logs "${{ steps.smoke.outputs.container_name }}" || true

      - name: Clean up smoke test
        if: always()
        shell: bash
        run: |
          if [ -n "${{ steps.smoke.outputs.container_name }}" ]; then
            docker rm -fv "${{ steps.smoke.outputs.container_name }}" >/dev/null 2>&1 || true
          fi
          if [ -n "${{ steps.smoke.outputs.volume_name }}" ]; then
            docker volume rm "${{ steps.smoke.outputs.volume_name }}" >/dev/null 2>&1 || true
          fi

  publish:
    name: Publish multi-platform image
    needs:
      - frontend-quality
      - image-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Docker Hub credentials
        shell: bash
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${DOCKERHUB_USERNAME}" ]; then
            echo "DOCKERHUB_USERNAME is not configured. Add it as a repository Variable or Secret."
            exit 1
          fi
          if [ -z "${DOCKERHUB_TOKEN}" ]; then
            echo "DOCKERHUB_TOKEN is not configured. Add it as a repository Secret."
            exit 1
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ env.DOCKER_PLATFORMS == 'linux/amd64,linux/arm64' }}
            type=raw,value=${{ env.ZEROTIER_REF }},enable=${{ env.DOCKER_PLATFORMS == 'linux/amd64,linux/arm64' }}
            type=sha,prefix=sha-,format=short
          labels: |
            org.opencontainers.image.title=ZeroTier Planet
            org.opencontainers.image.description=Self-hosted ZeroTier Planet root server and management console
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            io.zerotier-planet.zerotier-ref=${{ env.ZEROTIER_REF }}
            io.zerotier-planet.zerotier-commit=${{ needs.frontend-quality.outputs.zerotier-commit }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ env.DOCKER_PLATFORMS }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            TAG=${{ needs.frontend-quality.outputs.zerotier-commit }}
            SOURCE_COMMIT=${{ github.sha }}
            ZEROTIER_REF=${{ env.ZEROTIER_REF }}
            ZEROTIER_COMMIT=${{ needs.frontend-quality.outputs.zerotier-commit }}
          cache-from: |
            type=gha,scope=zerotier-planet-amd64
            type=gha,scope=zerotier-planet-publish
          cache-to: type=gha,mode=max,scope=zerotier-planet-publish
          provenance: mode=max
          sbom: true

      - name: Publish summary
        shell: bash
        run: |
          {
            echo "## Docker image published"
            echo
            echo "- Repository: \`${DOCKERHUB_USERNAME}/${IMAGE_NAME}\`"
            echo "- Platforms: \`${DOCKER_PLATFORMS}\`"
            echo "- ZeroTier ref: \`${ZEROTIER_REF}\`"
            echo "- ZeroTier commit: \`${{ needs.frontend-quality.outputs.zerotier-commit }}\`"
            echo "- Digest: \`${{ steps.push.outputs.digest }}\`"
            echo
            echo "### Tags"
            echo '```text'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
